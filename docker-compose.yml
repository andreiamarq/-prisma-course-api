services:
  postgres:
    image: postgres:16-alpine
    container_name: prisma-course-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: courses
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d courses"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
